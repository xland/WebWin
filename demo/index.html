<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>WebWin API 演示</title>
    <style>
      /* 三栏就是一屏，整页不滚：滚动只发生在右边的日志区内部。
         这里必须禁掉——否则 iframe 的行内基线会多出几像素，就顶出纵向滚动条 */
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      /* 三栏直接铺在 body 上：左目录 / 中功能（iframe）/ 右日志。
         不留 padding 也不用 gap：元素之间的间隙一律由各自的 margin 给 ——
         "这块占多少空间"在每个元素自己身上看得见，改一处不会牵连整排 */
      body {
        font-family: system-ui, "Microsoft YaHei", sans-serif;
        margin: 0;
        color: #222;
        background: #f7f7f8;
        display: flex;
        align-items: flex-start;
      }

      .note {
        font-size: 12px;
        color: #888;
        margin-bottom: 16px;
      }

      /* 左栏：能力域目录。窗口很矮时让这一栏自己滚，
         反正整页的 overflow 已经关掉了，不然会被直接裁掉 */
      .left {
        width: 130px;
        max-height: 100%;
        overflow: auto;
      }

      /* 目录项不是按钮：整条贯通左栏的左右两侧，没有圆角也没有描边，
         选中与否只靠底色区分 */
      .left button {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        font-size: 13px;
        padding: 8px 12px;
        margin: 0 0 2px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: #333;
        cursor: pointer;
      }

      .left button:hover {
        background: #e8e8eb;
      }

      /* 选中态：实心蓝底 */
      .left button.active {
        background: #2a6ecb;
        color: #fff;
      }

      .left button:disabled {
        color: #bbb;
        cursor: not-allowed;
      }

      /* 中栏：演示页跑在 iframe 里 */
      .middle {
        flex: 1;
        min-width: 0;
      }

      #content {
        display: block; /* iframe 默认 inline，行内基线会多出几像素撑高父容器 */
        box-sizing: border-box; /* 边框吃进 100% 里，不然各边溢出 1px 被 body 裁掉 */
        width: 100%;
        height: 100vh; /* body 没有 padding 了，直接顶满一屏 */
        border: 1px solid #e3e3e6;
        background: #fff;
      }

      /* 右栏：统一日志。宽度由分栏条拖拽改写，所以锁成"不伸不缩"，
         剩下的空间全给 flex:1 的中栏 */
      .right {
        width: 420px;
        flex: 0 0 auto;
        position: sticky;
        height: 100vh; /* 同上：body 没有 padding 了 */
        display: flex;
        flex-direction: column;
      }

      /* 中栏 / 右栏 之间的拖拽条。
         align-self:stretch 是因为 body 上设了 align-items:flex-start，
         不拉伸的话它会缩成一小截 */
      .splitter {
        flex: 0 0 auto;
        align-self: stretch;
        width: 8px;
        cursor: col-resize;
        position: relative;
        background: transparent;
        transition: background 0.15s;
        touch-action: none; /* 触屏拖拽交给 pointer 事件，别被页面滚动抢走 */
      }

      .splitter:hover,
      .splitter.dragging {
        background: #c9c9ce;
      }

      /* 竖排的三个点，让人一眼看出这里能拖 */
      .splitter::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 2px;
        height: 22px;
        border-left: 2px dotted #9a9aa0;
      }

      /* 拖拽时：整页显示左右箭头光标，禁止选中文字 */
      body.dragging {
        user-select: none;
        cursor: col-resize;
      }

      /* 拖拽时屏蔽 iframe：鼠标划过 iframe 会被它吃掉 pointer 事件，
         这是分栏拖不动最经典的坑 */
      body.dragging #content {
        pointer-events: none;
      }

      #log {
        flex: 1;
        overflow: auto;
        background: #1e1e1e;
        color: #d4d4d4;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        line-height: 1.6;
        padding: 12px;
        word-break: break-all;
      }

      .ok {
        color: #6a9955;
      }

      .err {
        color: #f07178;
      }

      .evt {
        color: #4fc1ff;
      }

      /* 清空按钮的定位参照物：日志区自己会滚，按钮要是普通块级元素
         就会跟着内容滚走，所以做成 absolute 悬浮在右上角 */
      #logBox {
        position: relative;
        flex: 1;
        display: flex;
      }

      #clearBtn {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 1;
        padding: 3px 8px;
        font-size: 11px;
        background: rgba(255, 255, 255, 0.12);
        border-color: #555;
        color: #ccc;
      }

      #clearBtn:hover {
        background: rgba(255, 255, 255, 0.22);
      }

      button {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border: 1px solid #c8c8cc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
    </style>
    <script src="log.js"></script>
  </head>

  <body>
    <!-- 左栏：能力域目录 -->
    <div class="left">
      <button class="active" onclick="openPage('win.html', this)">窗口</button>
      <button onclick="openPage('os.html', this)">系统</button>
      <button onclick="openPage('display.html', this)">显示</button>
      <button onclick="openPage('menu.html', this)">菜单</button>
      <button onclick="openPage('iframe.html', this)">子页面</button>
      <button onclick="openPage('app.html', this)">应用</button>
      <button onclick="openPage('dialog.html', this)">对话框</button>
      <button onclick="openPage('db.html', this)">数据库</button>
      <button onclick="openPage('tray.html', this)">托盘</button>
      <button onclick="openPage('path.html', this)">路径</button>
      <button onclick="openPage('http.html', this)">HTTP</button>
    </div>

    <!-- 中栏：演示页 -->
    <div class="middle">
      <iframe id="content" src="win.html"></iframe>
    </div>

    <!-- 中栏 / 右栏 之间的拖拽分栏条 -->
    <div id="splitter" class="splitter" title="拖动调整宽度"></div>

    <!-- 右栏：统一日志 -->
    <div class="right">
      <div id="logBox">
        <div id="log"></div>
        <button id="clearBtn" onclick="clearLog()">清空日志</button>
      </div>
    </div>

    <script>
      const frame = document.getElementById("content");

      // ------- 中栏 / 右栏 拖拽分栏 -------
      const splitter = document.getElementById("splitter");
      const rightCol = document.querySelector(".right");

      // 右栏的宽度上下限：再窄就看不清日志了，再宽会把中栏挤没
      const RIGHT_MIN = 220;
      const rightMax = () =>
        Math.max(RIGHT_MIN, window.innerWidth - 480); // 给中栏至少留 480

      let dragStartX = 0;
      let dragStartWidth = 0;
      let dragging = false;

      splitter.addEventListener("pointerdown", (e) => {
        // 指针捕获：之后哪怕鼠标划到 iframe 上面，事件也会回到 splitter，
        // 不会拖到一半就断掉（配合 CSS 里 body.dragging #content 的屏蔽更稳）
        splitter.setPointerCapture(e.pointerId);
        dragging = true;
        splitter.classList.add("dragging");
        document.body.classList.add("dragging");
        dragStartX = e.clientX;
        dragStartWidth = rightCol.getBoundingClientRect().width;
        e.preventDefault(); // 别让拖拽变成文字选中
      });

      splitter.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        // 鼠标往左移 clientX 变小 → 右栏应该变宽，所以是 (起点 - 当前)
        const width = dragStartWidth + (dragStartX - e.clientX);
        rightCol.style.width =
          Math.min(rightMax(), Math.max(RIGHT_MIN, width)) + "px";
      });

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        splitter.classList.remove("dragging");
        document.body.classList.remove("dragging");
        if (e && splitter.hasPointerCapture(e.pointerId))
          splitter.releasePointerCapture(e.pointerId);
      }

      splitter.addEventListener("pointerup", endDrag);
      splitter.addEventListener("pointercancel", endDrag);

      // 窗口变窄时 old 的右栏宽度可能超过新上限，跟着收一下
      window.addEventListener("resize", () => {
        const width = rightCol.getBoundingClientRect().width;
        const max = rightMax();
        if (width > max) rightCol.style.width = max + "px";
      });

      // 切换演示页：换 src 之前先让旧页面撤掉它的订阅
      function openPage(file, btn) {
        // C++ 那边记着"要给这个 iframe 推事件"，不撤的话事件会推给一个已经消失的文档。
        // 用 ?. 是因为刚建好还没加载的 iframe 里没有这个函数
        frame.contentWindow.unsubscribeAll?.();
        frame.src = file;

        for (const item of document.querySelectorAll(".left button"))
          item.classList.remove("active");
        btn.classList.add("active");
        log(`切换到 ${file}`);
      }

      function clearLog() {
        document.getElementById("log").innerHTML = "";
      }

      window.addEventListener("load", () => {
        log(
          `SDK 就绪：win 对象${typeof win === "undefined" ? "缺失" : "已注入"}`,
        );
      });
    </script>
  </body>
</html>
