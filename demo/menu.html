<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8">
	<title>WebWin 菜单 API 演示</title>
	<!-- 公共样式：所有演示页共用一套盒子 / 按钮 / 输入框，见 style.css -->
	<link rel="stylesheet" href="style.css">
	<!-- log() 会把日志写到外壳页面（index.html）右侧那一栏 -->
	<script src="log.js"></script>
</head>

<body>
	<section>
		<h2>建菜单（Menu.create）</h2>
		<button onclick="createMenu()">Menu.create([...])</button>
		<button onclick="popupMenu()">menu.popup()（在鼠标处弹）</button>
		<button class="danger" onclick="destroyMenu()">menu.destroy()</button>
		<div class="note">
			建出来的菜单长这样：4 个连着的 radio（同组互斥，Item3 默认勾选）、一条分隔线、
			一个带子菜单的 View。点任意一项，回调的参数里带 checked（radio / checkbox 才有）。
		</div>
	</section>

	<section>
		<h2>挂到窗口（win.setContextMenu）</h2>
		<button onclick="bindMenu()">win.setContextMenu(menu)</button>
		<button onclick="unbindMenu()">win.setContextMenu(null)</button>
		<div class="note">
			挂上之后，在<b>本页面</b>里点右键就弹这个菜单（浏览器默认的右键菜单会被换掉）。
			传 null 解绑，默认菜单回来。
		</div>
	</section>

	<script>
		let menu = null;

		// ---------- 建菜单 ----------
		async function createMenu() {
			try {
				menu = await Menu.create([
					{ label: 'Item1', type: 'radio', onclick: info => onItem('Item1', info) },
					{ label: 'Item2', type: 'radio', onclick: info => onItem('Item2', info) },
					{ label: 'Item3', type: 'radio', checked: true, onclick: info => onItem('Item3', info) },
					{ label: 'Item4', type: 'radio', onclick: info => onItem('Item4', info) },
					{ type: 'separator' },
					{
						label: 'View',
						submenu: [
							{ label: 'Checkbox', type: 'checkbox', onclick: info => onItem('View / Checkbox', info) },
							{ label: 'Normal', type: 'normal', id: 'abcdefg', onclick: info => onItem('View / Normal（id=abcdefg）', info) }
						]
					}
				]);
				log(`Menu.create → ok，菜单 id=${menu.id}`, 'ok');
			} catch (e) {
				// C++ 返回的错误是字符串，不是 Error 对象，所以取 message 前要判断一下
				log(`Menu.create → 失败：${e && e.message ? e.message : e}`, 'err');
			}
		}

		// 点击回调：radio / checkbox 的 info 里带 checked
		function onItem(name, info) {
			log(`点击 ${name}${info.checked === undefined ? '' : ` → checked=${info.checked}`}`, 'evt');
		}

		async function popupMenu() {
			try {
				await menu.popup();
				log('menu.popup() → ok', 'ok');
			} catch (e) {
				log(`menu.popup() → 失败：${e && e.message ? e.message : e}`, 'err');
			}
		}

		async function destroyMenu() {
			try {
				await menu.destroy();
				menu = null;
				log('menu.destroy() → ok', 'ok');
			} catch (e) {
				log(`menu.destroy() → 失败：${e && e.message ? e.message : e}`, 'err');
			}
		}

		// ---------- 挂到窗口 ----------
		async function bindMenu() {
			try {
				await win.setContextMenu(menu);
				log('win.setContextMenu(menu) → ok：在本页面里点右键试试', 'ok');
			} catch (e) {
				log(`win.setContextMenu(menu) → 失败：${e && e.message ? e.message : e}`, 'err');
			}
		}

		async function unbindMenu() {
			try {
				await win.setContextMenu(null);
				log('win.setContextMenu(null) → ok：回到浏览器默认的右键菜单', 'ok');
			} catch (e) {
				log(`win.setContextMenu(null) → 失败：${e && e.message ? e.message : e}`, 'err');
			}
		}

		// ---------- 启动 ----------
		window.addEventListener('load', () => {
			log(`SDK 就绪：Menu 对象${typeof Menu === 'undefined' ? '缺失' : '已注入'}`);
		});
	</script>
</body>

</html>
